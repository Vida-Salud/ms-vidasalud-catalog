server:
  port: 8091

spring:
  config:
    import: optional:file:.env[.properties]   # solo para correr desde el IDE
  application:
    name: ms-vidasalud-catalog

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
        app-id-uri: ${AZURE_APP_ID_URI:api://${AZURE_CLIENT_ID}}

  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        path-segment: 1   # /api/{version}/...
      supported: 1

  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1522}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME:vidasalud}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false


management:
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness y /actuator/health/readiness
